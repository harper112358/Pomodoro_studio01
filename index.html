      Math.min(1, (next.muted ? 0 : next.volume / 100) * (master / 100))

saved to LocalStorage. Freesound preview URLs are streamed as previews; review the original sound page and its exact license before use.</p><div className="grid"><div className="field"><label>Freesound API key</label><input type="password" value={freesoundKey} onChange={e=>setFreesoundKey(e.target.value)} placeholder="Paste your own API key" autoComplete="off"/></div><div className="field"><label>Search sounds</label><input value={audioQuery} onChange={e=>setAudioQuery(e.target.value)} placeholder="rain, ocean, library"/></div></div><div className="row"><button className="btn primary" disabled={audioBusy} onClick={searchFreesound}>{audioBusy?'Searching…':'Search Freesound'}</button><a href="https://freesound.org/apiv2/apply/" target="_blank" rel="noreferrer" className="inline-link">Get API key ↗</a></div><div className="grid" style={{marginTop:15}}>{audioResults.map(item=><article className="card" key={item.id}><h3>{item.name}</h3><div className="meta">Creator: {item.username}<br/>Source: Freesound<br/>License: {item.license||'Unverified'}</div><p><a className="inline-link" href={item.url} target="_blank" rel="noreferrer">Original sound page ↗</a></p><button className="btn primary" onClick={()=>addFreesound(item)}>Add preview</button></article>)}</div></>:<><p className="muted" style={{marginTop:14}}>Search video files hosted on Wikimedia Commons. Results are filtered to playable video files with CC0, Public Domain, CC BY or CC BY-SA metadata. Check the original file page for exact license terms and attribution before reuse.</p><div className="grid"><div className="field"><label>Search videos</label><input value={videoQuery} onChange={e=>setVideoQuery(e.target.value)} placeholder="rainy window, forest, ocean" onKeyDown={e=>e.key==='Enter'&&searchVideos()}/></div></div><button className="btn primary" disabled={videoBusy} onClick={searchVideos}>{videoBusy?'Searching…':'Search Wikimedia videos'}</button><p className="meta"><a href="https://commons.wikimedia.org/" target="_blank" rel="noreferrer">Wikimedia Commons ↗</a> · <a href="https://commons.wikimedia.org/wiki/Commons:Licensing" target="_blank" rel="noreferrer">Commons licensing guide ↗</a></p><div className="grid" style={{marginTop:15}}>{videoResults.length===0&&!videoBusy&&<div className="empty">No usable video results yet. Search to find playable, license-filtered videos.</div>}{videoResults.map(v=><article className="card" key={v.id}><video src={v.url} poster={v.thumbnail||undefined} muted playsInline preload="metadata" controls style={{width:"100%",borderRadius:12}}/><h3>{v.title}</h3><div className="meta">Creator: {v.creator}<br/>Source: Wikimedia Commons<br/>Format: {v.mime||'Video'}<br/>License: {v.license}</div><p><a className="inline-link" href={v.originalUrl} target="_blank" rel="noreferrer">Original file page ↗</a>{v.licenseUrl&&<> · <a className="inline-link" href={v.licenseUrl} target="_blank" rel="noreferrer">License ↗</a></>}</p><button className="btn primary" onClick={()=>applyVideo(v)}>Use as background video</button></article>)}</div></>}</section><section className="panel"><h2>Music platforms</h2><p className="muted">Spotify and YouTube are available as official embeds on the Home page. This app does not download, extract, or mix their audio.</p><a href="https://open.spotify.com/" target="_blank" rel="noreferrer">Spotify ↗</a> · <a href="https://www.youtube.com/" target="_blank" rel="noreferrer">YouTube ↗</a></section></>}
 {page==='My Worlds'&&<><div className="section-head" style={{marginBottom:14}}><h2>My Worlds</h2><button className="btn primary" onClick={saveWorld}>＋ Save current world</button></div>{presets.length===0?<div className="panel empty">No saved worlds yet. Customize your timer, visuals and sounds, then save your first preset.</div>:<div className="grid">{presets.map(p=><section className="panel" key={p.id}><div className="world-preview" style={{backgroundColor:p.config.bg,backgroundImage:p.config.image?`url("${p.config.image}")`:'none'}}/><h2>{p.name}</h2><p className="muted">Focus {p.config.focus}m · Short {p.config.short}m · Long {p.config.long}m</p><p className="muted small">{p.tracks?.length||0} audio tracks</p><div className="row"><button className="btn primary" onClick={()=>applyWorld(p)}>Apply</button><button className="btn" onClick={()=>{const n=prompt('Rename world',p.name);if(n?.trim())setPresets(old=>old.map(x=>x.id===p.id?{...x,name:n.trim()}:x))}}>Rename</button><button className="btn" onClick={()=>setPresets(old=>[...old,{...p,id:uid(),name:p.name+' Copy'}])}>Duplicate</button><button className="btn" onClick={()=>{if(confirm('Delete this world?'))setPresets(old=>old.filter(x=>x.id!==p.id))}}>Delete</button></div></section>)}</div>}</>}
 {page==='Settings'&&<><section className="panel"><h2>Settings & Backup</h2><p className="muted">No account required. Settings and presets stay in this browser's LocalStorage.</p><div className="row"><button className="btn primary" onClick={exportJson}>Export JSON backup</button><label className="btn">Import JSON<input hidden type="file" accept=".json,application/json" onChange={e=>importJson(e.target.files?.[0])}/></label></div><p className="muted small" style={{marginTop:12}}>Uploaded audio files are temporary browser object URLs and are not included in backups. Re-add them after reload/import. Image uploads stored as data URLs may increase LocalStorage usage.</p></section><section className="panel"><h2>Media Integrity & Attribution</h2><p className="muted">No AI-generated media is supplied. Built-in noise is generated mathematically by Web Audio, not by an AI model. User-provided media remains unverified until the user checks the original source and license.</p>{attributions.length===0?<div className="empty">No discovered-media attribution records yet.</div>:attributions.map((a,i)=><div className="track" key={i}><div className="track-main"><strong>{a.title}</strong><div className="meta">Creator: {a.creator||'Unknown'} · Source: {a.source}<br/>License: {a.license||'Unverified'} {a.licenseVersion||''}<br/>Attribution: {a.attribution||'Not provided'}<br/>Review status: {a.verifiedBy||'Unverified'}</div><div className="row">{a.originalUrl&&<a className="inline-link" href={a.originalUrl} target="_blank" rel="noreferrer">Original source ↗</a>}{a.licenseUrl&&<a className="inline-link" href={a.licenseUrl} target="_blank" rel="noreferrer">License ↗</a>}</div></div></div>)}</section><section className="panel"><h2>Media policy</h2><ul className="muted" style={{lineHeight:2}}><li>Prefer CC0 and Public Domain.</li><li>CC BY is only a candidate when creator and attribution details are present.</li><li>CC BY-NC is not automatically accepted.</li><li>Unknown licenses and unverifiable sources are not approved.</li><li>Spotify and YouTube use embedded players only; no audio extraction.</li><li>Wikimedia Commons video search filters for CC0, Public Domain, CC BY and CC BY-SA metadata. Review each original file page and license.</li><li>User-uploaded and user-provided URLs require rights confirmation.</li><li>Provider metadata is not a legal guarantee. Check the original source.</li></ul></section></>}
 {notice&&<div className="notice" role="status">{notice}<button className="btn" style={{float:'right',padding:'3px 8px'}} onClick={()=>setNotice('')}>Dismiss</button></div>}
 </main><footer className="footer">POMODORO STUDIO · LOCAL FIRST · BUILD YOUR OWN WORLD</footer></div></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
