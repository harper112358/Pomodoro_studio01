<style>

:root{font-family:'DM Sans',system-ui,sans-serif;color:#e8eee7;background:#141d19;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent)}
.app{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font),sans-serif;font-size:var(--font-size,16px);position:relative;isolation:isolate}.backdrop{position:fixed;inset:0;z-index:-2;background-position:center;background-size:cover;filter:blur(var(--blur));transform:scale(1.03)}.shade{position:fixed;inset:0;z-index:-1;background:rgba(10,17,14,var(--overlay));pointer-events:none}.wrap{max-width:1180px;margin:auto;padding:22px}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:1px solid #ffffff20;padding:10px 0 22px}.brand{font:600 25px 'Playfair Display',serif;letter-spacing:.2px}.brand span{color:var(--accent)}.tagline,.muted{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn,.tab{border:1px solid #ffffff24;border-radius:10px;padding:10px 13px;background:#ffffff0c;color:var(--text)}.nav button.active,.btn.primary,.tab.active{background:var(--accent);color:#17211d;border-color:var(--accent);font-weight:700}.btn:hover,.nav button:hover{filter:brightness(1.1)}.main{padding:28px 0}.panel{background:var(--panel);border:1px solid #ffffff1c;border-radius:18px;padding:20px;margin-bottom:16px;backdrop-filter:blur(14px)}h1,h2,h3,p{margin-top:0}h2{font:500 24px 'Playfair Display',serif;margin-bottom:16px}h3{font-size:15px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}.timer{text-align:center;padding:34px 15px}.timer-number{font:500 clamp(76px,15vw,142px)/1 'Playfair Display',serif;letter-spacing:-5px;margin:18px 0}.session-tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.session-tabs button{border:1px solid #ffffff35;background:transparent;color:var(--text);border-radius:24px;padding:8px 13px}.session-tabs button.active{background:var(--accent);color:#17211d}.progress{height:5px;max-width:370px;background:#ffffff24;border-radius:9px;margin:24px auto;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}.field input:not([type=checkbox]):not([type=range]):not([type=color]),.field select,.searchbox{width:100%;padding:11px 12px;border:1px solid #ffffff2c;border-radius:9px;background:#101915aa;color:var(--text);outline:none}.field select option{background:#17211d}.field input[type=color]{width:100%;height:43px;padding:3px;background:#101915;border:1px solid #ffffff2c;border-radius:9px}.field input[type=range]{width:100%;accent-color:var(--accent)}.field input[type=checkbox]{accent-color:var(--accent)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.track{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid #ffffff1b;background:#ffffff08;border-radius:12px;margin:9px 0}.track-main{flex:1;min-width:140px}.track input[type=range]{width:110px;accent-color:var(--accent)}.small{font-size:12px}.card{border:1px solid #ffffff1e;background:#ffffff09;border-radius:13px;padding:13px;min-width:0}.card img{width:100%;height:145px;object-fit:cover;border-radius:8px;background:#26352d}.card h3{margin:10px 0 6px;overflow-wrap:anywhere}.card p{overflow-wrap:anywhere}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notice{padding:12px 14px;border-radius:10px;background:#b5c9a81c;border:1px solid #b5c9a844;color:#e8eee7;margin:14px 0;font-size:13px}.danger{color:#ffc5b9}.embed iframe{width:100%;border:0;border-radius:12px;min-height:152px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}.meta{font-size:12px;color:var(--muted);line-height:1.65;overflow-wrap:anywhere}.inline-link{font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{font-size:11px;border:1px solid #ffffff30;padding:4px 8px;border-radius:20px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #ffffff30;border-radius:12px}.world-preview{height:95px;border-radius:10px;background-size:cover;background-position:center;margin-bottom:12px}.license{font-size:11px;border-radius:6px;padding:3px 7px;background:#ffffff13;display:inline-block;margin:3px 0}
@media(max-width:650px){.wrap{padding:14px}.header{align-items:flex-start}.nav{width:100%}.nav button{flex:1;padding:9px 5px;font-size:12px}.main{padding:19px 0}.panel{padding:15px}.timer{padding:28px 6px}.timer-number{letter-spacing:-3px}.track input[type=range]{width:85px}}

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const KEY='pomodoro-studio-single-v1';
const DEFAULT={focus:25,short:5,long:15,cycles:4,autoStart:false,bg:'#17231d',accent:'#b8cba9',text:'#e8eee7',image:'',overlay:55,blur:0,master:70,font:'DM Sans',fontSize:16,gradient:false};
const AMBIENTS=['Rain','Thunder','Wind','Ocean','Waterfall','Birds','Library','Café','Fireplace','Train','City'];
const NOISES=['White Noise','Pink Noise','Brown Noise'];
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function readSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function validHttpUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u:null}catch{return null}}
function youtubeId(value){const u=validHttpUrl(value);if(!u)return null;if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0]||null;if(u.hostname.endsWith('youtube.com')||u.hostname.endsWith('youtube-nocookie.com')){if(u.pathname==='/watch')return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].includes(p[0]))return p[1]||null}return null}
function spotifyEmbed(value){const u=validHttpUrl(value);if(!u||!u.hostname.endsWith('spotify.com'))return null;const p=u.pathname.split('/').filter(Boolean);if(!['track','album','playlist','episode','show'].includes(p[0])||!p[1])return null;return `https://open.spotify.com/embed/${p[0]}/${p[1]}`}
function App(){
 const saved=useRef(readSaved()).current;
 const [config,setConfig]=useState({...DEFAULT,...saved.config});
 const [tracks,setTracks]=useState(saved.tracks||[]);
 const [presets,setPresets]=useState(saved.presets||[]);
 const [page,setPage]=useState('Home');
 const [session,setSession]=useState(saved.timer?.session||'Focus');
 const [cycle,setCycle]=useState(saved.timer?.cycle||1);
 const [remaining,setRemaining]=useState(saved.timer?.remaining??(saved.config?.focus||25)*60);
 const [running,setRunning]=useState(Boolean(saved.timer?.running&&saved.timer?.deadline>Date.now()));
 const [deadline,setDeadline]=useState(saved.timer?.running&&saved.timer?.deadline>Date.now()?saved.timer.deadline:null);
 const [notice,setNotice]=useState('');
 const [musicUrl,setMusicUrl]=useState('');const [embed,setEmbed]=useState('');
 const [imageQuery,setImageQuery]=useState('');const [imageResults,setImageResults]=useState([]);const [imageBusy,setImageBusy]=useState(false);
 const [audioQuery,setAudioQuery]=useState('rain');const [freesoundKey,setFreesoundKey]=useState('');const [audioResults,setAudioResults]=useState([]);const [audioBusy,setAudioBusy]=useState(false);
 const [customUrl,setCustomUrl]=useState('');const [customName,setCustomName]=useState('');const [licenseUrl,setLicenseUrl]=useState('');const [creator,setCreator]=useState('');const [rightsConfirmed,setRightsConfirmed]=useState(false);
 const [selectedTab,setSelectedTab]=useState('Images');
 const [master,setMaster]=useState(config.master);
 const [attributions,setAttributions]=useState(saved.attributions||[]);
 const audioCtx=useRef(null),masterGain=useRef(null),nodes=useRef({}),sources=useRef({}),elements=useRef({}),finishGuard=useRef(false);
 const configRef=useRef(config),sessionRef=useRef(session),cycleRef=useRef(cycle);
 useEffect(()=>{configRef.current=config},[config]);useEffect(()=>{sessionRef.current=session},[session]);useEffect(()=>{cycleRef.current=cycle},[cycle]);
 useEffect(()=>{localStorage.setItem(KEY,JSON.stringify({config,tracks:tracks.map(t=>({...t,src:t.kind==='file'?null:t.src})),presets,attributions,timer:{session,cycle,remaining,running,deadline}}))},[config,tracks,presets,attributions,session,cycle,remaining,running,deadline]);
 const duration=(s,c=config)=>({Focus:c.focus,'Short Break':c.short,'Long Break':c.long}[s]||c.focus)*60;
 const changeSession=(next,nextCycle)=>{setSession(next);setCycle(nextCycle);setRemaining(duration(next,configRef.current));setDeadline(null);setRunning(false);finishGuard.current=false};
 const completeSession=()=>{if(finishGuard.current)return;finishGuard.current=true;const s=sessionRef.current,c=cycleRef.current,cfg=configRef.current;let next,nc=c;if(s==='Focus'){if(c>=cfg.cycles){next='Long Break';nc=1}else next='Short Break'}else{next='Focus';nc=s==='Short Break'?Math.min(cfg.cycles,c+1):1}setSession(next);setCycle(nc);const nextSeconds=duration(next,cfg);setRemaining(nextSeconds);setRunning(Boolean(cfg.autoStart));setDeadline(cfg.autoStart?Date.now()+nextSeconds*1000:null);if('Notification'in window&&Notification.permission==='granted')new Notification('Pomodoro Studio',{body:`${s} complete — ${next} starts now.`});setNotice(`${s} session completed.`);setTimeout(()=>{finishGuard.current=false},0)};
 useEffect(()=>{if(!running||!deadline)return;const tick=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));setRemaining(left);if(left===0){setRunning(false);setDeadline(null);completeSession()}};tick();const id=setInterval(tick,200);return()=>clearInterval(id)},[running,deadline]);
 useEffect(()=>{const onVis=()=>{if(document.visibilityState==='visible'&&running&&deadline){const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));setRemaining(left);if(left===0){setRunning(false);setDeadline(null);completeSession()}}};document.addEventListener('visibilitychange',onVis);return()=>document.removeEventListener('visibilitychange',onVis)},[running,deadline]);
 const start=()=>{if(remaining<=0)return;if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();finishGuard.current=false;setDeadline(Date.now()+remaining*1000);setRunning(true)};
 const pause=()=>{if(deadline)setRemaining(Math.max(0,Math.ceil((deadline-Date.now())/1000)));setRunning(false);setDeadline(null)};
 const reset=()=>{setRunning(false);setDeadline(null);setRemaining(duration(session))};
 const skip=()=>{setRunning(false);setDeadline(null);completeSession()};
 const setCfg=(key,value)=>{setConfig(p=>({...p,[key]:value}));if(['focus','short','long'].includes(key)&&!running&&({Focus:'focus','Short Break':'short','Long Break':'long'}[session]===key))setRemaining(Number(value)*60)};
 const getCtx=()=>{if(!audioCtx.current){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Web Audio API is unavailable');audioCtx.current=new C();masterGain.current=audioCtx.current.createGain();masterGain.current.gain.value=master/100;masterGain.current.connect(audioCtx.current.destination)}if(audioCtx.current.state==='suspended')audioCtx.current.resume();return audioCtx.current};
 const getNode=id=>{const ctx=getCtx();if(!nodes.current[id]){const n=ctx.createGain();n.connect(masterGain.current);nodes.current[id]=n}return nodes.current[id]};
 const addNoise=type=>{const id=uid();const t={id,name:type,kind:'noise',noiseType:type,volume:35,muted:false,license:'Procedurally generated noise (not AI)',creator:'Pomodoro Studio',source:'Built-in Web Audio oscillator/buffer'};setTracks(p=>[...p,t]);try{playNoise(t)}catch(e){setNotice(e.message)}};
 const playNoise=t=>{const ctx=getCtx();if(sources.current[t.id]){sources.current[t.id].stop();delete sources.current[t.id];return}const length=ctx.sampleRate*4,b=ctx.createBuffer(1,length,ctx.sampleRate),d=b.getChannelData(0);let a=0,brown=0;for(let i=0;i<length;i++){const w=Math.random()*2-1;if(t.noiseType==='White Noise')d[i]=w;else if(t.noiseType==='Pink Noise'){a=.97*a+.03*w;d[i]=a*2.5}else{a=.98*a+.02*w;brown=(brown+.02*a)/1.02;d[i]=brown*4}}const src=ctx.createBufferSource();src.buffer=b;src.loop=true;src.connect(getNode(t.id));getNode(t.id).gain.value=t.muted?0:t.volume/100;src.start();sources.current[t.id]=src};
 const playTrack=t=>{if(t.kind==='noise'){playNoise(t);return}const el=elements.current[t.id];if(!el){setNotice('This track has no available local source. Re-add the file or URL.');return}try{const ctx=getCtx();if(!el._connected){const source=ctx.createMediaElementSource(el);source.connect(getNode(t.id));el._connected=true}getNode(t.id).gain.value=t.muted?0:t.volume/100;if(el.paused)el.play().catch(()=>setNotice('Playback failed. Check the file format, URL and CORS policy.'));else el.pause()}catch(e){setNotice('Audio could not connect to mixer: '+e.message)}};
 const updateTrack=(id,patch)=>{setTracks(p=>p.map(t=>t.id===id?{...t,...patch}:t));const t=tracks.find(x=>x.id===id);if(nodes.current[id])nodes.current[id].gain.value=(patch.muted??t?.muted)?0:(patch.volume??t?.volume??0)/100};
 const removeTrack=id=>{if(sources.current[id]){try{sources.current[id].stop()}catch{}delete sources.current[id]}const el=elements.current[id];if(el){el.pause();el.removeAttribute('src');el.load()}delete nodes.current[id];setTracks(p=>p.filter(t=>t.id!==id))};
 const setMasterVolume=v=>{setMaster(Number(v));setConfig(p=>({...p,master:Number(v)}));if(masterGain.current)masterGain.current.gain.value=Number(v)/100};
 const addFile=file=>{if(!file)return;const src=URL.createObjectURL(file),id=uid();setTracks(p=>[...p,{id,name:file.name,kind:'file',src,volume:50,muted:false,creator:'User supplied',source:'Local upload',license:'Unverified — user must confirm rights',licenseUrl:'',attribution:''}]);setNotice('Local audio added. It is temporary and will need to be re-added after a reload. Verify the usage rights.')};
 const addUrlTrack=()=>{const u=validHttpUrl(customUrl);if(!u){setNotice('Enter a valid HTTP(S) audio URL.');return}if(!rightsConfirmed){setNotice('Confirm that you have permission to use this audio before adding it.');return}const id=uid();setTracks(p=>[...p,{id,name:customName||'Custom audio',kind:'url',src:u.href,volume:50,muted:false,creator:creator||'Unknown',source:'User supplied URL',license:'User-confirmed rights — not independently verified',licenseUrl,attribution:creator}]);setCustomUrl('');setCustomName('');setNotice('Added as user-supplied media. The app does not independently verify rights.')};
 const saveWorld=()=>{const name=prompt('ตั้งชื่อโลกของคุณ / Name this world');if(!name?.trim())return;const snapshot={id:uid(),name:name.trim(),config:{...config},tracks:tracks.map(t=>({...t,src:t.kind==='file'?null:t.src})),attributions:[...attributions],created:new Date().toISOString()};setPresets(p=>[...p,snapshot]);setNotice('World saved locally.')};
 const applyWorld=p=>{Object.values(sources.current).forEach(s=>{try{s.stop()}catch{}});sources.current={};nodes.current={};setConfig({...DEFAULT,...p.config});setMaster(p.config.master??70);setTracks((p.tracks||[]).map(t=>({...t,src:t.kind==='file'?null:t.src})));setAttributions(p.attributions||[]);setSession('Focus');setCycle(1);setRemaining((p.config.focus||25)*60);setRunning(false);setDeadline(null);setPage('Home');setNotice('World applied. Re-add any uploaded local audio files.')};
 const exportJson=()=>{const data={version:1,config,tracks:tracks.map(t=>({...t,src:t.kind==='file'?null:t.src})),presets,attributions};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pomodoro-studio-backup.json';a.click();URL.revokeObjectURL(a.href)};
 const importJson=file=>{if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.config||!Array.isArray(x.tracks)||!Array.isArray(x.presets))throw Error();setConfig({...DEFAULT,...x.config});setMaster(x.config.master??70);setTracks(x.tracks);setPresets(x.presets);setAttributions(x.attributions||[]);setNotice('Backup imported. Uploaded local files are not included.')}catch{setNotice('Invalid Pomodoro Studio backup.')}};r.readAsText(file)};
 const searchImages=async()=>{if(!imageQuery.trim())return;setImageBusy(true);setImageResults([]);try{const r=await fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(imageQuery)}&page_size=20`);if(!r.ok)throw Error(`Openverse returned ${r.status}`);const data=await r.json();setImageResults(data.results||[])}catch(e){setNotice('Image search failed: '+e.message)}finally{setImageBusy(false)}};
 const imageLicense=item=>String(item.license||'').toLowerCase();
 const approvedImage=item=>['cc0','pdm','by'].includes(imageLicense(item))&&Boolean(item.url)&&Boolean(item.foreign_landing_url)&&(imageLicense(item)!=='by'||Boolean(item.creator));
 const useImage=item=>{if(!approvedImage(item)){setNotice('This image is not approved: missing or unsupported license/source metadata.');return}const attribution={title:item.title||'Untitled',creator:item.creator||'Unknown',source:'Openverse',originalUrl:item.foreign_landing_url,license:item.license,licenseVersion:item.license_version||'',licenseUrl:item.license_url||'',attribution:item.attribution||item.creator||'',verifiedBy:'Provider metadata only; user must review original source'};setConfig(p=>({...p,image:item.url}));setAttributions(p=>[...p.filter(a=>a.originalUrl!==attribution.originalUrl),attribution]);setNotice('Image applied. Review its original source and attribution before reuse.')};
 const searchFreesound=async()=>{if(!freesoundKey.trim()){setNotice('Freesound search needs your own API key. Get one from Freesound and enter it here; it is kept only in this page session.');return}setAudioBusy(true);setAudioResults([]);try{const r=await fetch(`https://freesound.org/apiv2/search/text/?query=${encodeURIComponent(audioQuery)}&page_size=20&fields=id,name,username,url,license,previews,description`,{headers:{Authorization:`Token ${freesoundKey.trim()}`}});if(!r.ok)throw Error(`Freesound returned ${r.status}`);const data=await r.json();setAudioResults(data.results||[])}catch(e){setNotice('Freesound search failed: '+e.message)}finally{setAudioBusy(false)}};
 const loadMusic=()=>{const y=youtubeId(musicUrl);const s=spotifyEmbed(musicUrl);if(y)setEmbed(`https://www.youtube-nocookie.com/embed/${y}`);else if(s)setEmbed(s);else setNotice('Unsupported link. Paste a standard YouTube video or Spotify track/album/playlist/episode/show URL.')};
 const addFreesound=(item)=>{const lic=(item.license||'').toLowerCase();const allowed=lic.includes('creativecommons.org/publicdomain/zero')||lic.includes('creativecommons.org/licenses/by/');if(!allowed){setNotice('This result is not CC0 or CC BY based on the returned metadata. It is not added.');return}const p=item.previews?.['preview-hq-mp3']||item.previews?.['preview-lq-mp3'];if(!p){setNotice('No preview URL was supplied by Freesound.');return}const id=uid();setTracks(old=>[...old,{id,name:item.name,kind:'url',src:p,volume:45,muted:false,creator:item.username,source:'Freesound preview',license:lic.includes('/zero/')?'CC0':'CC BY — review attribution',licenseUrl:item.license,attribution:item.username,originalUrl:item.url}]);setAttributions(old=>[...old,{title:item.name,creator:item.username,source:'Freesound',originalUrl:item.url,license:item.license,licenseUrl:item.license,attribution:item.username,verifiedBy:'Freesound API metadata; review original page'}]);setNotice('Added Freesound preview. Preview playback is for discovery; check download/use conditions on the original page.')};
 const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
 const total=duration(session),percent=Math.max(0,Math.min(100,remaining/total*100));
 return <div className="app" style={{'--bg':config.gradient?`linear-gradient(135deg,${config.bg},#263b31)`:config.bg,'--accent':config.accent,'--text':config.text,'--muted':'#aebcaf','--panel':'#ffffff0c','--overlay':config.overlay/100,'--blur':`${config.blur}px`,'--font':config.font,'--font-size':`${config.fontSize||16}px`}}><div className="backdrop" style={{backgroundImage:config.image?`url("${config.image}")`:'none'}}/><div className="shade"/><div className="wrap">
 <header className="header"><div><div className="brand">Pomodoro <span>Studio.</span></div><div className="tagline">Build your own focus world</div></div><nav className="nav">{['Home','Customize','Discover','My Worlds','Settings'].map(x=><button key={x} className={page===x?'active':''} onClick={()=>setPage(x)}>{x}</button>)}</nav></header>
 <main className="main">
 {page==='Home'&&<><section className="panel timer"><div className="eyebrow">YOUR PERSONAL SPACE</div><div className="session-tabs">{['Focus','Short Break','Long Break'].map(s=><button key={s} className={session===s?'active':''} onClick={()=>changeSession(s,cycle)}>{s}</button>)}</div><div className="timer-number">{fmt(remaining)}</div><div className="muted">Cycle {cycle} of {config.cycles}</div><div className="progress"><div style={{width:`${percent}%`}}/></div><div className="actions">{running?<button className="btn primary" onClick={pause}>Ⅱ Pause</button>:<button className="btn primary" onClick={start}>▶ Start</button>}<button className="btn" onClick={reset}>↻ Reset</button><button className="btn" onClick={skip}>Skip →</button></div><p className="muted" style={{marginTop:18,marginBottom:0}}>{running?'Stay in your flow.':'Ready when you are.'}</p></section>
 <div className="grid"><section className="panel"><div className="eyebrow">YOUR ENVIRONMENT</div><h2>Soundscape</h2><p className="muted">{tracks.length} ambient tracks configured</p><button className="btn" onClick={()=>setPage('Customize')}>Open Audio Studio →</button></section><section className="panel"><div className="eyebrow">TIME SETTINGS</div><h2>Pomodoro Cycle</h2><p className="muted">Focus {config.focus}m · Short {config.short}m · Long {config.long}m</p><button className="btn" onClick={()=>setPage('Customize')}>Customize Timer →</button></section></div>
 <section className="panel"><div className="section-head"><h2>External Music</h2><span className="pill">Official embedded player</span></div><div className="row"><input className="searchbox" style={{flex:1,minWidth:180}} placeholder="Paste Spotify or YouTube URL" value={musicUrl} onChange={e=>setMusicUrl(e.target.value)}/><button className="btn primary" onClick={loadMusic}>Load player</button><button className="btn" onClick={()=>setEmbed('')}>Clear</button></div>{embed&&<div className="embed" style={{marginTop:15}}><iframe src={embed} title="External music player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowFullScreen/></div>}<p className="muted small" style={{marginTop:10}}>Spotify / YouTube players are separate from the ambient mixer. Their volume is controlled by the embedded platform, not this master mixer.</p></section></>}
 {page==='Customize'&&<>
 <section className="panel"><h2>⏱ Timer Studio</h2><div className="grid">{[['focus','Focus duration (minutes)',1,180],['short','Short break (minutes)',1,60],['long','Long break (minutes)',1,120],['cycles','Number of cycles',1,20]].map(([key,label,min,max])=><div className="field" key={key}><label>{label}</label><input type="number" min={min} max={max} value={config[key]} onChange={e=>setCfg(key,Math.max(min,Math.min(max,Number(e.target.value)||min)))}/></div>)}</div><label className="row muted"><input type="checkbox" checked={config.autoStart} onChange={e=>setCfg('autoStart',e.target.checked)}/> Automatically start the next session</label><p className="muted small" style={{marginTop:10}}>Timer uses an absolute deadline (Date.now). The interval only refreshes the display; pausing stores the actual remaining time.</p></section>
 <section className="panel"><div className="section-head"><h2>🎵 Audio Studio</h2><span className="pill">Multi-track mixer</span></div><p className="muted">Built-in noise is generated locally with Web Audio (not AI). Nature and environment recordings must be added from a source whose license you have checked.</p><h3>Noise generator</h3><div className="row">{NOISES.map(n=><button className="btn" key={n} onClick={()=>addNoise(n)}>+ {n}</button>)}</div><h3 style={{marginTop:20}}>Ambient categories</h3><div className="row">{AMBIENTS.map(n=><button className="btn" key={n} onClick={()=>{setAudioQuery(n.toLowerCase());setSelectedTab('Audio');setPage('Discover')}}>Find {n}</button>)}</div><div className="field"><label>Upload audio file (temporary until page closes/reloads)</label><input type="file" accept="audio/*" onChange={e=>addFile(e.target.files?.[0])}/></div><h3>Add audio URL</h3><div className="grid"><div className="field"><label>Audio URL (HTTP/HTTPS)</label><input value={customUrl} onChange={e=>setCustomUrl(e.target.value)} placeholder="https://example.org/sound.mp3"/></div><div className="field"><label>Track name</label><input value={customName} onChange={e=>setCustomName(e.target.value)} placeholder="Rain on window"/></div><div className="field"><label>Creator / rights holder</label><input value={creator} onChange={e=>setCreator(e.target.value)} placeholder="Creator name"/></div><div className="field"><label>License URL or permission evidence</label><input value={licenseUrl} onChange={e=>setLicenseUrl(e.target.value)} placeholder="https://..."/></div></div><label className="row muted"><input type="checkbox" checked={rightsConfirmed} onChange={e=>setRightsConfirmed(e.target.checked)}/> I have checked and have permission to use this audio.</label><button className="btn primary" style={{marginTop:10}} onClick={addUrlTrack}>+ Add custom URL</button><div className="field" style={{marginTop:20}}><label>Master volume: {master}%</label><input type="range" min="0" max="100" value={master} onChange={e=>setMasterVolume(e.target.value)}/></div><h3>Active tracks</h3>{tracks.length===0?<div className="empty">No active tracks yet. Add a noise, upload a file, or add a licensed audio URL.</div>:tracks.map(t=><div className="track" key={t.id}>{t.kind!=='noise'&&t.src&&<audio ref={el=>{if(el)elements.current[t.id]=el}} src={t.src} loop crossOrigin="anonymous" preload="none"/>}<div className="track-main"><strong>{t.name}</strong><div className="meta">{t.source||'Built-in noise'} · {t.license||'License metadata unavailable'}</div></div><button className="btn" onClick={()=>playTrack(t)}>{t.kind==='noise'?(sources.current[t.id]?'Ⅱ':'▶'):(elements.current[t.id]?.paused===false?'Ⅱ':'▶')}</button><input aria-label={`Volume ${t.name}`} type="range" min="0" max="100" value={t.volume} onChange={e=>updateTrack(t.id,{volume:Number(e.target.value)})}/><button className="btn" onClick={()=>updateTrack(t.id,{muted:!t.muted})}>{t.muted?'Unmute':'Mute'}</button><button className="btn" onClick={()=>removeTrack(t.id)}>✕</button></div>)}</section>
 <section className="panel"><h2>🖼 Visual Studio</h2><div className="grid"><div className="field"><label>Background color</label><input type="color" value={config.bg.startsWith('#')?config.bg:'#17231d'} onChange={e=>setCfg('bg',e.target.value)}/></div><div className="field"><label>Accent color</label><input type="color" value={config.accent} onChange={e=>setCfg('accent',e.target.value)}/></div><div className="field"><label>Text color</label><input type="color" value={config.text} onChange={e=>setCfg('text',e.target.value)}/></div><div className="field"><label>Background image URL</label><input value={config.image} onChange={e=>setCfg('image',e.target.value)} placeholder="Paste a licensed image URL"/></div></div><div className="field"><label>Upload background image (local browser only)</label><input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>setCfg('image',r.result);r.readAsDataURL(f)}}/></div><div className="grid"><div className="field"><label>Overlay: {config.overlay}%</label><input type="range" min="0" max="95" value={config.overlay} onChange={e=>setCfg('overlay',Number(e.target.value))}/></div><div className="field"><label>Background blur: {config.blur}px</label><input type="range" min="0" max="20" value={config.blur} onChange={e=>setCfg('blur',Number(e.target.value))}/></div><div className="field"><label>Typography</label><select value={config.font} onChange={e=>setCfg('font',e.target.value)}><option>DM Sans</option><option>Georgia</option><option>Arial</option><option>Trebuchet MS</option><option>Courier New</option></select></div><div className="field"><label>Background style</label><select value={config.gradient?'gradient':'solid'} onChange={e=>setCfg('gradient',e.target.value==='gradient')}><option value="solid">Solid</option><option value="gradient">Gradient</option></select></div></div><button className="btn" onClick={()=>setCfg('image','')}>Remove background image</button></section>
 </>}
 {page==='Discover'&&<><section className="panel"><h2>🔍 Media Discovery</h2><div className="row"><button className={'tab '+(selectedTab==='Images'?'active':'')} onClick={()=>setSelectedTab('Images')}>Images · Openverse</button><button className={'tab '+(selectedTab==='Audio'?'active':'')} onClick={()=>setSelectedTab('Audio')}>Audio · Freesound</button></div>
 {selectedTab==='Images'?<><p className="muted" style={{marginTop:14}}>Search image metadata from Openverse. The app only enables selection for CC0, Public Domain Mark and CC BY results with attribution metadata. This is provider metadata, not a legal guarantee; inspect the original page.</p><div className="row"><input className="searchbox" style={{flex:1,minWidth:170}} placeholder="forest, rain, library..." value={imageQuery} onChange={e=>setImageQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&searchImages()}/><button className="btn primary" disabled={imageBusy} onClick={searchImages}>{imageBusy?'Searching…':'Search images'}</button></div><div className="grid" style={{marginTop:16}}>{imageResults.map((item,i)=><article className="card" key={item.id||i}><img src={item.thumbnail||item.url} alt={item.title||'Openverse image'} loading="lazy"/><h3>{item.title||'Untitled'}</h3><div className="meta">Creator: {item.creator||'Unknown'}<br/>Source: Openverse<br/>License: {item.license||'Unverified'} {item.license_version||''}<br/>Attribution: {item.attribution||item.creator||'Not supplied'}</div><span className="license">{approvedImage(item)?'Candidate — review source':'Not approved / unverified'}</span><p><a className="inline-link" href={item.foreign_landing_url} target="_blank" rel="noreferrer">Original source ↗</a>{item.license_url&&<> · <a className="inline-link" href={item.license_url} target="_blank" rel="noreferrer">License ↗</a></>}</p><button className="btn primary" disabled={!approvedImage(item)} onClick={()=>useImage(item)}>Use image</button></article>)}</div></>:<><p className="muted" style={{marginTop:14}}>Freesound API search requires your own API key. The key is held only in this page's React state and is not saved to LocalStorage. Freesound preview URLs are streamed as previews; review the original sound page and its exact license before use.</p><div className="grid"><div className="field"><label>Freesound API key</label><input type="password" value={freesoundKey} onChange={e=>setFreesoundKey(e.target.value)} placeholder="Paste your own API key" autoComplete="off"/></div><div className="field"><label>Search sounds</label><input value={audioQuery} onChange={e=>setAudioQuery(e.target.value)} placeholder="rain, ocean, library"/></div></div><div className="row"><button className="btn primary" disabled={audioBusy} onClick={searchFreesound}>{audioBusy?'Searching…':'Search Freesound'}</button><a href="https://freesound.org/apiv2/apply/" target="_blank" rel="noreferrer" className="inline-link">Get API key ↗</a></div><div className="grid" style={{marginTop:15}}>{audioResults.map(item=><article className="card" key={item.id}><h3>{item.name}</h3><div className="meta">Creator: {item.username}<br/>Source: Freesound<br/>License: {item.license||'Unverified'}</div><p><a className="inline-link" href={item.url} target="_blank" rel="noreferrer">Original sound page ↗</a></p><button className="btn primary" onClick={()=>addFreesound(item)}>Add preview</button></article>)}</div></>}</section><section className="panel"><h2>Music platforms</h2><p className="muted">Spotify and YouTube are available as official embeds on the Home page. This app does not download, extract, or mix their audio.</p><a href="https://open.spotify.com/" target="_blank" rel="noreferrer">Spotify ↗</a> · <a href="https://www.youtube.com/" target="_blank" rel="noreferrer">YouTube ↗</a></section></>}
 {page==='My Worlds'&&<><div className="section-head" style={{marginBottom:14}}><h2>My Worlds</h2><button className="btn primary" onClick={saveWorld}>＋ Save current world</button></div>{presets.length===0?<div className="panel empty">No saved worlds yet. Customize your timer, visuals and sounds, then save your first preset.</div>:<div className="grid">{presets.map(p=><section className="panel" key={p.id}><div className="world-preview" style={{backgroundColor:p.config.bg,backgroundImage:p.config.image?`url("${p.config.image}")`:'none'}}/><h2>{p.name}</h2><p className="muted">Focus {p.config.focus}m · Short {p.config.short}m · Long {p.config.long}m</p><p className="muted small">{p.tracks?.length||0} audio tracks</p><div className="row"><button className="btn primary" onClick={()=>applyWorld(p)}>Apply</button><button className="btn" onClick={()=>{const n=prompt('Rename world',p.name);if(n?.trim())setPresets(old=>old.map(x=>x.id===p.id?{...x,name:n.trim()}:x))}}>Rename</button><button className="btn" onClick={()=>setPresets(old=>[...old,{...p,id:uid(),name:p.name+' Copy'}])}>Duplicate</button><button className="btn" onClick={()=>{if(confirm('Delete this world?'))setPresets(old=>old.filter(x=>x.id!==p.id))}}>Delete</button></div></section>)}</div>}</>}
 {page==='Settings'&&<><section className="panel"><h2>Settings & Backup</h2><p className="muted">No account required. Settings and presets stay in this browser's LocalStorage.</p><div className="row"><button className="btn primary" onClick={exportJson}>Export JSON backup</button><label className="btn">Import JSON<input hidden type="file" accept=".json,application/json" onChange={e=>importJson(e.target.files?.[0])}/></label></div><p className="muted small" style={{marginTop:12}}>Uploaded audio files are temporary browser object URLs and are not included in backups. Re-add them after reload/import. Image uploads stored as data URLs may increase LocalStorage usage.</p></section><section className="panel"><h2>Media Integrity & Attribution</h2><p className="muted">No AI-generated media is supplied. Built-in noise is generated mathematically by Web Audio, not by an AI model. User-provided media remains unverified until the user checks the original source and license.</p>{attributions.length===0?<div className="empty">No discovered-media attribution records yet.</div>:attributions.map((a,i)=><div className="track" key={i}><div className="track-main"><strong>{a.title}</strong><div className="meta">Creator: {a.creator||'Unknown'} · Source: {a.source}<br/>License: {a.license||'Unverified'} {a.licenseVersion||''}<br/>Attribution: {a.attribution||'Not provided'}<br/>Review status: {a.verifiedBy||'Unverified'}</div><div className="row">{a.originalUrl&&<a className="inline-link" href={a.originalUrl} target="_blank" rel="noreferrer">Original source ↗</a>}{a.licenseUrl&&<a className="inline-link" href={a.licenseUrl} target="_blank" rel="noreferrer">License ↗</a>}</div></div></div>)}</section><section className="panel"><h2>Media policy</h2><ul className="muted" style={{lineHeight:2}}><li>Prefer CC0 and Public Domain.</li><li>CC BY is only a candidate when creator and attribution details are present.</li><li>CC BY-NC is not automatically accepted.</li><li>Unknown licenses and unverifiable sources are not approved.</li><li>Spotify and YouTube use embedded players only; no audio extraction.</li><li>User-uploaded and user-provided URLs require rights confirmation.</li><li>Provider metadata is not a legal guarantee. Check the original source.</li></ul></section></>}
 {notice&&<div className="notice" role="status">{notice}<button className="btn" style={{float:'right',padding:'3px 8px'}} onClick={()=>setNotice('')}>Dismiss</button></div>}
 </main><footer className="footer">POMODORO STUDIO · LOCAL FIRST · BUILD YOUR OWN WORLD</footer></div></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
